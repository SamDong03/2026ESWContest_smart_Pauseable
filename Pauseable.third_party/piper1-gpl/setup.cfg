[bdist_wheel]
py_limited_api = cp39

[flake8]

max-line-length = 88


ignore =
    E501,
    W503,
    E203,
    D202,
    W504

exclude =
    src/piper/*.pyi
    src/piper/train/vits/*.py

[isort]
multi_line_output = 3
include_trailing_comma=True
force_grid_wrap=0
use_parentheses=True
line_length=88
indent = "    "
