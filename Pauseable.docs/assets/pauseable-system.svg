<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1100" viewBox="0 0 1480 1100" role="img" aria-labelledby="title desc"><title id="title">Memolink 시스템 아키텍처 · 개발팀 PAUSEABLE</title><desc id="desc">Pi 5 안의 Home Assistant와 두 AI 파이프라인, C++ Central, 로컬 출력, 클라우드 API와 보호자 앱을 구분합니다. 카메라와 개인화 음성의 별도 연결도 함께 표시합니다.</desc><defs><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#38734b"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#376a9d"/></marker><marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#93611e"/></marker><marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#79578f"/></marker></defs><rect width="1480" height="1100" fill="#fff"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="47" font-size="32" fill="#21372d" font-weight="700" text-anchor="start">Memolink 시스템 아키텍처</text><text x="1448" y="47" font-size="19" fill="#56685e" font-weight="700" text-anchor="end">개발팀 PAUSEABLE</text><text x="32" y="79" font-size="19" fill="#56685e" font-weight="400" text-anchor="start">가전·이동 정보를 Pi 5에서 분석하고, 검증한 결정을 로컬 출력과 보호자 앱으로 연결합니다.</text><rect x="32" y="112" width="244" height="692" rx="16" fill="#eaf4e7" stroke="#a9cda2" stroke-width="1.3"/><text x="56" y="152" font-size="25" fill="#38734b" font-weight="700" text-anchor="start">생활 데이터 입력</text><text x="56" y="180" font-size="17" fill="#56685e" font-weight="400" text-anchor="start">가전 · 실내 이동</text><path d="M56 198H252" stroke="#a9cda2"/><rect x="316" y="112" width="740" height="692" rx="16" fill="#eaf1fc" stroke="#adc4e4" stroke-width="1.3"/><text x="340" y="152" font-size="25" fill="#376a9d" font-weight="700" text-anchor="start">로컬 분석 · 중앙 제어</text><text x="340" y="180" font-size