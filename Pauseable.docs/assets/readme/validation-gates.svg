<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="444" viewBox="0 0 1120 444" role="img" aria-labelledby="title desc"><title id="title">Central 입력 검증과 실행 조건</title><desc id="desc">메시지 형식에 이어 출처·시각·사건 ID와 실행 정책을 검사합니다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="444" rx="8" fill="#f5f8f6"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">Central 입력 검증과 실행 조건</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">메시지 형식에 이어 출처·시각·사건 ID와 실행 정책을 검사합니다.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="142" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="142" width="4" height="100" rx="2" fill="#245c45"/><text x="50" y="172" fill="#203b30" font-size="18" font-weight="700">JSON</text><text x="50" y="196" fill="#65786e" font-size="13.5" font-weight="400">문법 · 자료형</text><path d="M228.8 192H246.8" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="246.8" y="142" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="246.8" y="142" width="4" height="100" rx="2" fill="#245c45"/><text x="264.8" y="172" fill="#203b30" font-size="18" font-weight="700">Schema</text><text x="264.8" y="196" fill="#65786e" font-size="13.5" font-weight="400">필수 필드</text><text x="264.8" y="215" fill="#65786e" font-size="13.5" font-weight="400">허용값 · 범위</text><path d="M443.6 192H461.6" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="461.6" y="142" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="461.6" y="142" width="4" height="100" rx="2" fill="#245c45"/><text x="479.6" y="172" fill="#203b30" font-size="18" font-weight="700">출처 · 시각</text><text x="479.6" y="196" fill="#65786e"