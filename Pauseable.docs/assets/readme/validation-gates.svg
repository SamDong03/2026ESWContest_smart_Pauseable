<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc"><title id="title">Central 수신 검증의 다섯 단계</title><desc id="desc">어떤 조건을 검사하고 어디에서 거절·중복·억제를 기록하는지 구분합니다.</desc><defs><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2c684d"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356797"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087b7d"/></marker><marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#916013"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9b4641"/></marker></defs><rect width="1440" height="680" fill="#fff"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="46" font-size="32" font-weight="700" fill="#23382f" data-max-width="1040">Central 수신 검증의 다섯 단계</text><text x="1122" y="43" font-size="17" font-weight="700" fill="#52675d" data-max-width="286">Memolink / 개발팀 PAUSEABLE</text><text x="32" y="79" font-size="19" font-weight="400" fill="#52675d" data-max-width="1376">어떤 조건을 검사하고 어디에서 거절·중복·억제를 기록하는지 구분합니다.</text><path d="M32 100H1408" stroke="#dbe5df"/><rect x="32" y="132" width="1376" height="48" rx="0" fill="#356797" stroke="#356797" stroke-width="1.3"/><text x="48" y="163" font-size="19" font-weight="700" fill="#fff" data-max-width="58">단계</text><text x="138" y="163" font-size="19" font-weight="700" fill="#fff" data-max-width="272">검사</text><text x="442" y="163" font-size="19" font-weight="700" fill="#fff" data-max-width="522">통과 조건</text><text x="996" y="163" font-size="19" font-weight="700" fill="#fff" data-max-width="396">미통과 처리</text><rect x="32" y="180" width="1376" height="68" rx="0" fill="#fff" stroke="#dbe5df" stroke-width="1.3"/><text x="48" y="211" font-size="18" font-weight="700" fill="#23382f" data-max-width="58">01</text><text x="138" y="211" font-size="18" font-weight="400" fill="#23382f" data-max-width="272">JSON / 계약</text><text x="442" y="211" font-size="18" font-weight="400" fill="#23382f" data-max-width="522">문법 · 필수 필드 · 자료형 · 허용값</text><text x="996" y="211" font-size="18" font-weight="400" fill="#23382f" data-max-width="396">거절 사유 기록</text><rect x="32" y="248" width="1376" height="68" rx="0" fill="#f3f6f4" stroke="#dbe5df" stroke-width="1.3"/><text x="48" y="279" font-size="18" font-weight="700" fill="#23382f" data-max-width="58">02</text><text x="138" y="279" font-size="18" font-weight="400" fill="#23382f" data-max-width="272">출처 / 식별</text><text x="442" y="279" font-size="18" font-weight="400" fill="#23382f" data-max-width="522">Topic = source · 대상자 / 장치 일치</text><text x="996" y="279" font-size="18" font-weight="400" fill="#23382f" data-max-width="396">잘못된 출처·ID 거절</text><rect x="32" y="316" width="1376" height="68" rx="0" fill="#fff" stroke="#dbe5df" stroke-width="1.3"/><text x="48" y="347" font-size="18" font-weight="700" fill="#23382f" data-max-width="58">03</text><text x="138" y="347" font-size="18" font-weight="400" fill="#23382f" data-max-width="272">사건 시각</text><text x="442" y="347" font-size="18" font-weight="400" fill="#23382f" data-max-width="522">UTC · 과거 300초 / 미래 30초 이내</text><text x="996" y="347" font-size="18" font-weight="400" fill="#23382f" data-max-width="396">stale / invalid_clock</text><rect x="32" y="384" width="1376" height="68" rx="0" fill="#f3f6f4" stroke="#dbe5df" stroke-width="1.3"/><text x="48" y="415" font-size="18" font-weight="700" fill="#23382f" data-max-width="58">04</text><text x="138" y="415" font-size="18" font-weight="400" fill="#23382f" data-max-width="272">event_id / 내용</text><text x="442" y="415" font-size="18" font-weight="400" fill="#23382f" data-max-width="522">새 사건 · 동일 ID 내용 일치 여부</text><text x="996" y="415" font-size="18" font-weight="400" fill="#23382f" data-max-width="396">동일 내용 중복 / 내용 충돌</text><rect x="32" y="452" width="1376" height="68" rx="0" fill="#fff" stroke="#dbe5df" stroke-width="1.3"/><text x="48" y="483" font-size="18" font-weight="700" fill="#23382f" data-max-width="58">05</text><text x="138" y="483" font-size="18" font-weight="400" fill="#23382f" data-max-width="272">Action Router</text><text x="442" y="483" font-size="18" font-weight="400" fill="#23382f" data-max-width="522">활성화 · 위험 단계 · 상태 · cooldown</text><text x="996" y="483" font-size="18" font-weight="400" fill="#23382f" data-max-width="396">감사 기록 / 실행 억제</text><rect x="32" y="554" width="662" height="80" rx="8" fill="#edf3fb" stroke="#adc7e1" stroke-width="1.3"/><text x="50" y="583" font-size="19" font-weight="700" fill="#356797" data-max-width="626">입력 형식 검사와 실행 승인은 다릅니다</text><text x="50" y="611" font-size="18" font-weight="400" fill="#52675d" data-max-width="626">계약이 맞아도 출력 정책에 따라 실행하지 않을 수 있습니다.</text><rect x="718" y="554" width="690" height="80" rx="8" fill="#fff6e3" stroke="#ddc795" stroke-width="1.3"/><text x="736" y="583" font-size="19" font-weight="700" fill="#916013" data-max-width="654">잘못된 입력을 정상으로 변환하지 않습니다</text><text x="736" y="611" font-size="18" font-weight="400" fill="#52675d" data-max-width="654">Unknown은 Normal과 구분하며 가전 동작으로 연결하지 않습니다.</text></g></svg>
