<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc"><title id="title">설계·시험·평가·실기 기록의 읽는 법</title><desc id="desc">검증 자료를 네 범주로 나누고, 각 자료가 설명하는 범위를 구분합니다.</desc><defs><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2c684d"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356797"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087b7d"/></marker><marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#916013"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9b4641"/></marker></defs><rect width="1440" height="790" fill="#fff"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="46" font-size="32" font-weight="700" fill="#23382f" data-max-width="1040">설계·시험·평가·실기 기록의 읽는 법</text><text x="1122" y="43" font-size="17" font-weight="700" fill="#52675d" data-max-width="286">Memolink / 개발팀 PAUSEABLE</text><text x="32" y="79" font-size="19" font-weight="400" fill="#52675d" data-max-width="1376">검증 자료를 네 범주로 나누고, 각 자료가 설명하는 범위를 구분합니다.</text><path d="M32 100H1408" stroke="#dbe5df"/><rect x="32" y="126" width="660" height="266" rx="12" fill="#edf5ec" stroke="#abc8b2" stroke-width="1.3"/><text x="52" y="166" font-size="23" font-weight="700" fill="#2c684d" data-max-width="620">구현 코드</text><path d="M32 184H692" stroke="#abc8b2"/><rect x="52" y="210" width="620" height="144" rx="8" fill="#fff" stroke="#abc8b2" stroke-width="1.3"/><text x="70" y="243" font-size="22" font-weight="700" fill="#23382f" data-max-width="584">해당 버전이 무엇을 하는가</text><text x="70" y="272" font-size="18" font-weight="400" fill="#52675d" data-max-width="584">입력 · 알고리즘 · 통신 · 실행 정책</text><text x="70" y="298" font-size="18" font-weight="400" fill="#52675d" data-max-width="584">기능별 코드 위치 / 현재 README</text><text x="70" y="324" font-size="18" font-weight="400" fill="#52675d" data-max-width="584">코드 존재만으로 장치 적용을 증명하지 않음</text><rect x="748" y="126" width="660" height="266" rx="12" fill="#edf3fb" stroke="#adc7e1" stroke-width="1.3"/><text x="768" y="166" font-size="23" font-weight="700" fill="#356797" data-max-width="620">자동 검사</text><path d="M748 184H1408" stroke="#adc7e1"/><rect x="768" y="210" width="620" height="144" rx="8" fill="#fff" stroke="#adc7e1" stroke-width="1.3"/><text x="786" y="243" font-size="22" font-weight="700" fill="#23382f" data-max-width="584">검사한 조건에서 코드가 통과했는가</text><text x="786" y="272" font-size="18" font-weight="400" fill="#52675d" data-max-width="584">Unit · 회귀 검사 · 빌드 / 대상 commit</text><text x="786" y="298" font-size="18" font-weight="400" fill="#52675d" data-max-width="584">Workflow · 실행 로그 · 테스트 범위</text><text x="786" y="324" font-size="18" font-weight="400" fill="#52675d" data-max-width="584">모의 입력과 실제 입출력은 별개</text><rect x="32" y="432" width="660" height="266" rx="12" fill="#eaf6f4" stroke="#a3ccc6" stroke-width="1.3"/><text x="52" y="472" font-size="23" font-weight="700" fill="#087b7d" data-max-width="620">저장된 평가</text><path d="M32 490H692" stroke="#a3ccc6"/><rect x="52" y="516" width="620" height="144" rx="8" fill="#fff" stroke="#a3ccc6" stroke-width="1.3"/><text x="70" y="549" font-size="22" font-weight="700" fill="#23382f" data-max-width="584">어떤 데이터에서 어떤 결과를 얻었는가</text><text x="70" y="578" font-size="18" font-weight="400" fill="#52675d" data-max-width="584">출처 · 분할 · 분모 · 시나리오 · 수치</text><text x="70" y="604" font-size="18" font-weight="400" fill="#52675d" data-max-width="584">JSON 원본 · 그래프 · 출처 해시</text><text x="70" y="630" font-size="18" font-weight="400" fill="#52675d" data-max-width="584">합성 평가와 환자 성능은 별개</text><rect x="748" y="432" width="660" height="266" rx="12" fill="#fff6e3" stroke="#ddc795" stroke-width="1.3"/><text x="768" y="472" font-size="23" font-weight="700" fill="#916013" data-max-width="620">장치 실기 기록</text><path d="M748 490H1408" stroke="#ddc795"/><rect x="768" y="516" width="620" height="144" rx="8" fill="#fff" stroke="#ddc795" stroke-width="1.3"/><text x="786" y="549" font-size="22" font-weight="700" fill="#23382f" data-max-width="584">설치한 버전이 실제로 동작했는가</text><text x="786" y="578" font-size="18" font-weight="400" fill="#52675d" data-max-width="584">장치 · 설정 · 모델 · 입력 · 출력</text><text x="786" y="604" font-size="18" font-weight="400" fill="#52675d" data-max-width="584">같은 event_id로 API · 화면 · 소리 대조</text><text x="786" y="630" font-size="18" font-weight="400" fill="#52675d" data-max-width="584">과거 팀 시연과 최신 버전 재시험 구분</text><text x="32" y="746" font-size="20" font-weight="400" fill="#52675d" data-max-width="1376">네 범주의 근거를 함께 제시합니다. 자동 검사 하나를 전체 실기 성능으로 확대하지 않습니다.</text></g></svg>
