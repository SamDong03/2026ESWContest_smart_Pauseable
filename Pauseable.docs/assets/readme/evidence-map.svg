<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="428" viewBox="0 0 1120 428" role="img" aria-labelledby="title desc"><title id="title">Read evidence in layers</title><desc id="desc">Implementation, saved experiments and current hardware behavior answer different questions.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="428" rx="8" fill="#f5f8f6"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">Read evidence in layers</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">Implementation, saved experiments and current hardware behavior answer different questions.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="138" width="246" height="128" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="138" width="4" height="128" rx="2" fill="#245c45"/><text x="50" y="168" fill="#203b30" font-size="18" font-weight="700">Code</text><text x="50" y="192" fill="#65786e" font-size="13.5" font-weight="400">Implementation and contracts</text><text x="50" y="211" fill="#65786e" font-size="13.5" font-weight="400">What exists in this version</text><path d="M278 202H302" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="302" y="138" width="246" height="128" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="302" y="138" width="4" height="128" rx="2" fill="#315f92"/><text x="320" y="168" fill="#203b30" font-size="18" font-weight="700">Automated checks</text><text x="320" y="192" fill="#65786e" font-size="13.5" font-weight="400">Unit / regression / build</text><text x="320" y="211" fill="#65786e" font-size="13.5" font-weight="400">What the selected run checks</text><path d="M548 202H572" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="572" y="138" width="246" height="128" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="572" y="138" width="4" height="128" rx="2" fill="#147f82"/><text x="590" y="168" fill="#203b30" font-size="18" font-weight="700">Recorded evidence</text><text x="590" y="192" fill="#65786e" font-size="13.5" font-weight="400">Data origin / metrics / reports</text><text x="590" y="211" fill="#65786e" font-size="13.5" font-weight="400">What a stored experiment supports</text><path d="M818 202H842" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="842" y="138" width="246" height="128" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="842" y="138" width="4" height="128" rx="2" fill="#a46a1e"/><text x="860" y="168" fill="#203b30" font-size="18" font-weight="700">Device E2E</text><text x="860" y="192" fill="#65786e" font-size="13.5" font-weight="400">Sensors / output / app display</text><text x="860" y="211" fill="#65786e" font-size="13.5" font-weight="400">What a real device run proves</text><rect x="32" y="318" width="1056" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="48" y="343" fill="#245c45" font-size="14" font-weight="700">TRACE EVERY CLAIM</text><text x="48" y="364" fill="#65786e" font-size="13" font-weight="400">Code version + data origin + command + result file + untested scope. A later layer is not proved by an earlier one.</text><text x="32" y="408" fill="#65786e" font-size="12" font-weight="400">Architecture / policy diagram. Not a live status display.</text></g></svg>
