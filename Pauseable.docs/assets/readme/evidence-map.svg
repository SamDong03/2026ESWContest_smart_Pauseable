<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="428" viewBox="0 0 1120 428" role="img" aria-labelledby="title desc"><title id="title">구현과 검증 자료의 구성</title><desc id="desc">자동 검사·저장된 평가·실제 장치 시험은 각각의 입력과 조건에 따라 해석합니다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="428" rx="8" fill="#f5f8f6"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">구현과 검증 자료의 구성</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">자동 검사·저장된 평가·실제 장치 시험은 각각의 입력과 조건에 따라 해석합니다.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="138" width="246" height="128" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="138" width="4" height="128" rx="2" fill="#245c45"/><text x="50" y="168" fill="#203b30" font-size="18" font-weight="700">구현 코드</text><text x="50" y="192" fill="#65786e" font-size="13.5" font-weight="400">알고리즘 · 통신 · 실행 제어</text><text x="50" y="211" fill="#65786e" font-size="13.5" font-weight="400">해당 버전의 구현 범위</text><path d="M278 202H302" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="302" y="138" width="246" height="128" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="302" y="138" width="4" height="128" rx="2" fill="#315f92"/><text x="320" y="168" fill="#203b30" font-size="18" font-weight="700">자동 검사</text><text x="320" y="192" fill="#65786e" font-size="13.5" font-weight="400">Unit / 회귀 검사 / 빌드</text><text x="320" y="211" fill="#65786e" font-size="13.5" font-weight="400">모의 입력과 코드 검사</text><path d="M548 202H572" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="572" y="138" width="246" height="128" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="572" y="138" width="4" height="128" rx="2" fill="#147f82"/><text x="590" y="168" fill="#203b30" font-size="18" font-weight="700">평가 기록</text><text x="590" y="192" fill="#65786e" font-size="13.5" font-weight="400">데이터 출처 · 수치 · 보고서</text><text x="590" y="211" fill="#65786e" font-size="13.5" font-weight="400">저장된 실험의 평가 범위</text><path d="M818 202H842" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="842" y="138" width="246" height="128" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="842" y="138" width="4" height="128" rx="2" fill="#a46a1e"/><text x="860" y="168" fill="#203b30" font-size="18" font-weight="700">장치 실기 시험</text><text x="860" y="192" fill="#65786e" font-size="13.5" font-weight="400">센서 · 음성 · 가전 · 앱</text><text x="860" y="211" fill="#65786e" font-size="13.5" font-weight="400">설치한 장치의 실제 입출력</text><rect x="32" y="318" width="1056" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="48" y="343" fill="#245c45" font-size="14" font-weight="700">검증 기록</text><text x="48" y="364" fill="#65786e" font-size="13" font-weight="400">코드·모델 버전, 데이터 출처, 실행 명령, 결과 파일과 미실행 항목을 함께 기록합니다.</text></g></svg>
