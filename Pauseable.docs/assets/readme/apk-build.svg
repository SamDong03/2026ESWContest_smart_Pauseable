<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc"><title id="title">Build the test app, then verify it on the phone</title><desc id="desc">Server credentials and Device / Worker Tokens do not belong in the APK.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="420" rx="8" fill="#f5f8f6"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">Build the test app, then verify it on the phone</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">Server credentials and Device / Worker Tokens do not belong in the APK.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="144" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="50" y="174" fill="#203b30" font-size="18" font-weight="700">Manual trigger</text><text x="50" y="198" fill="#65786e" font-size="13.5" font-weight="400">workflow_dispatch</text><path d="M228.8 194H246.8" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="246.8" y="144" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="246.8" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="264.8" y="174" fill="#203b30" font-size="18" font-weight="700">Private config</text><text x="264.8" y="198" fill="#65786e" font-size="13.5" font-weight="400">Client Firebase</text><text x="264.8" y="217" fill="#65786e" font-size="13.5" font-weight="400">App Token</text><path d="M443.6 194H461.6" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="461.6" y="144" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="461.6" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="479.6" y="174" fill="#203b30" font-size="18" font-weight="700">Source checks</text><text x="479.6" y="198" fill="#65786e" font-size="13.5" font-weight="400">Analyze / test</text><path d="M658.4000000000001 194H676.4000000000001" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="676.4000000000001" y="144" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="676.4000000000001" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="694.4000000000001" y="174" fill="#203b30" font-size="18" font-weight="700">Build APK</text><text x="694.4000000000001" y="198" fill="#65786e" font-size="13.5" font-weight="400">Team test signing</text><path d="M873.2 194H891.2" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="891.2" y="144" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="891.2" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="909.2" y="174" fill="#203b30" font-size="18" font-weight="700">Artifact</text><text x="909.2" y="198" fill="#65786e" font-size="13.5" font-weight="400">APK + SHA-256</text><text x="909.2" y="217" fill="#65786e" font-size="13.5" font-weight="400">3-day retention</text><rect x="32" y="306" width="1056" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="48" y="331" fill="#315f92" font-size="14" font-weight="700">ON THE PHONE</text><text x="48" y="352" fill="#65786e" font-size="13" font-weight="400">Install the APK, allow notifications, then check foreground / background / lock-screen delivery.</text><text x="32" y="400" fill="#65786e" font-size="12" font-weight="400">Architecture / policy diagram. Not a live status display.</text></g></svg>
