text x="479.6" y="198" fill="#65786e" font-size="13.5" font-weight="400">Analyze / test</text><path d="M658.4000000000001 194H676.4000000000001" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="676.4000000000001" y="144" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="676.4000000000001" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="694.4000000000001" y="174" fill="#203b30" font-size="18" font-weight="700">APK 빌드</text><text x="694.4000000000001" y="198" fill="#65786e" font-size="13.5" font-weight="400">팀 시험용 서명</text><path d="M873.2 194H891.2" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="891.2" y="144" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="891.2" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="909.2" y="174" fill="#203b30" font-size="18" font-weight="700">산출물</text><text x="909.2" y="198" fill="#65786e" font-size="13.5" font-weight="400">APK + SHA-256</text><text x="909.2" y="217" fill="#65786e" font-size="13.5" font-weight="400">보관 기간 3일</text><rect x="32" y="306" width="1056" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="48" y="331" fill="#315f92" font-size="14" font-weight="700">휴대폰 설치 후 확인</text><text x="48" y="352" fill="#65786e" font-size="13" font-weight="400">알림 권한을 설정하고 foreground / background / 잠금 상태에서 수신·표시·앱 이동을 시험합니다.</text></g></svg>
