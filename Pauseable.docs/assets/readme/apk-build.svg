584">실제 알림과 앱 이동</text><text x="786" y="438" font-size="18" font-weight="400" fill="#52675d" data-max-width="584">Foreground / Background / 잠금 상태</text><text x="786" y="464" font-size="18" font-weight="400" fill="#52675d" data-max-width="584">같은 event_id의 API 저장 · 실제 표시 대조</text><path d="M672 430H768" fill="none" stroke="#356797" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-blue)"/><rect x="32" y="584" width="1376" height="80" rx="8" fill="#fff6e3" stroke="#ddc795" stroke-width="1.3"/><text x="50" y="613" font-size="19" font-weight="700" fill="#916013" data-max-width="1340">빌드 성공과 휴대폰 수신 성공을 따로 기록합니다</text><text x="50" y="641" font-size="18" font-weight="400" fill="#52675d" data-max-width="1340">현재 내부 시험 APK는 공개 배포용 사용자 인증·서명·릴리스 체계를 대신하지 않습니다.</text></g></svg>
