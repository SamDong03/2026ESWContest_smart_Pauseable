<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="562" viewBox="0 0 1140 562" role="img" aria-labelledby="title desc"><title id="title">Memolink 동작 개요 · 개발팀 PAUSEABLE</title><desc id="desc">가전과 이동 정보 수집, 독립 행동 분석, Central 검증과 실행 결정, 음성·가전·보호자 앱 연결. 카메라·환경 조명·음성 학습은 별도 경로입니다.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#78988a"/></marker></defs><rect width="1140" height="562" rx="8" fill="#f8fbf9"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="28" y="40" font-size="25" fill="#203b30" font-weight="700">Memolink, 한눈에 보는 동작 흐름</text><text x="28" y="69" font-size="15" fill="#60766c" font-weight="400">생활 이력을 분석하고, 실행 조건을 확인한 뒤 안내와 보호자 연결로 이어집니다.</text><path d="M28 91H1112" stroke="#d4e2d9"/><text x="28" y="124" font-size="16" fill="#29634c" font-weight="700">01  생활 정보 수집</text><rect x="28" y="144" width="244" height="244" rx="6" fill="#edf6ef" stroke="#d4e2d9"/><g transform="translate(48 163)" fill="none" stroke="#29634c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19L22 3l19 16M8 15v27h28V15M18 42V28h9v14"/></g><text x="48" y="242" font-size="18" fill="#203b30" font-weight="700">가전 상태 · 실내 이동</text><text x="48" y="280" font-size="14.5" fill="#263e35" font-weight="400">Home Assistant 상태 변경</text><text x="48" y="307" font-size="14.5" fill="#263e35" font-weight="400">mmWave 위치 · 추적 정보</text><path d="M48 330H252" stroke="#cdded4"/><text x="48" y="362" font-size="13" fill="#60766c" font-weight="400">관측 시각과 품질도 기록</text><path d="M277 263h24" stroke="#78988a" stroke-width="2" marker-end="url(#arrow)"/><text x="308" y="124" font-size="16" fill="#31658f" font-weight="700">02  행동 분석</text><rect x="308" y="144" width="244" height="244" rx="6" fill="#eef4fa" stroke="#d4e2d9"/><g transform="translate(328 163)" fill="none" stroke="#31658f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 42V5M5 42h36M12 32l8-12 8 6L40 9"/><circle cx="20" cy="20" r="3"/><circle cx="28" cy="26" r="3"/></g><text x="328" y="242" font-size="18" fill="#203b30" font-weight="700">반복행동 · 배회 의심</text><text x="328" y="280" font-size="14.5" fill="#263e35" font-weight="400">가전: Baseline + IF · AE</text><text x="328" y="307" font-size="14.5" fill="#263e35" font-weight="400">이동: 경로 형태 · 개인 이력</text><path d="M328 330H532" stroke="#cdded4"/><text x="328" y="362" font-size="13" fill="#60766c" font-weight="400">두 파이프라인은 독립 실행</text><path d="M557 263h24" stroke="#78988a" stroke-width="2" marker-end="url(#arrow)"/><text x="588" y="124" font-size="16" fill="#245c45" font-weight="700">03  실행 결정</text><rect x="588" y="144" width="244" height="244" rx="6" fill="#e8f2eb" stroke="#d4e2d9"/><g transform="translate(608 163)" fill="none" stroke="#245c45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="28" height="28" rx="4"/><path d="M17 2v7m12-7v7M17 37v7m12-7v7M2 17h7m-7 12h7m28-12h7m-7 12h7M16 24l5 5 10-12"/></g><text x="608" y="242" font-size="18" fill="#203b30" font-weight="700">Pi 5 / Central App</text><text x="608" y="280" font-size="14.5" fill="#263e35" font-weight="400">출처 · 시각 · 중복 검사</text><text x="608" y="307" font-size="14.5" fill="#263e35" font-weight="400">Action Router로 출력 결정</text><path d="M608 330H812" stroke="#cdded4"/><text x="608" y="362" font-size="13" fill="#60766c" font-weight="400">잘못된 입력 · 재실행 제한</text><path d="M837 263h24" stroke="#78988a" stroke-width="2" marker-end="url(#arrow)"/><text x="868" y="124" font-size="16" fill="#147d80" font-weight="700">04  안내와 보호자 연결</text><rect x="868" y="144" width="244" height="244" rx="6" fill="#edf7f7" stroke="#d4e2d9"/><g transform="translate(888 163)" fill="none" stroke="#147d80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h8l11-9v30l-11-9H3zM27 18a12 12 0 010 16"/><rect x="35" y="5" width="16" height="37" rx="3"/><path d="M41 36h4"/></g><text x="888" y="242" font-size="18" fill="#203b30" font-weight="700">음성 · 가전 · 앱</text><text x="888" y="280" font-size="14.5" fill="#263e35" font-weight="400">Piper TTS · 가전 요청</text><text x="888" y="307" font-size="14.5" fill="#263e35" font-weight="400">API → Flutter 알림 · 이력</text><path d="M888 330H1092" stroke="#cdded4"/><text x="888" y="362" font-size="13" fill="#60766c" font-weight="400">각 장치의 실제 출력 확인</text><text x="28" y="432" font-size="17" fill="#203b30" font-weight="700">함께 연결되는 기능</text><text x="28" y="462" font-size="15" fill="#31658f" font-weight="700">출입 사진</text><text x="145" y="462" font-size="15" fill="#263e35" font-weight="400">Pi 4 카메라 → API → 보호자 앱</text><text x="600" y="462" font-size="15" fill="#147d80" font-weight="700">환경 조명</text><text x="717" y="462" font-size="15" fill="#263e35" font-weight="400">거주지역 · 날씨 · 태양 고도 → HA 조명</text><text x="28" y="496" font-size="15" fill="#29634c" font-weight="700">보호자 음성</text><text x="145" y="496" font-size="15" fill="#263e35" font-weight="400">동의 · 녹음 → GPU 학습 → 검증한 ONNX → Pi TTS</text><text x="28" y="537" font-size="12" fill="#60766c" font-weight="400">작품 Memolink · 개발팀 PAUSEABLE</text></g></svg>
