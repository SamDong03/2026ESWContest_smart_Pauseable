<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc"><title id="title">거주지역 · 날씨 · 태양 고도 기반 조명</title><desc id="desc">앱의 지역 설정과 HA 조명 엔티티를 장치 설정에 연결합니다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="420" rx="8" fill="#f5f8f6"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">거주지역 · 날씨 · 태양 고도 기반 조명</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">앱의 지역 설정과 HA 조명 엔티티를 장치 설정에 연결합니다.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="140" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="140" width="4" height="100" rx="2" fill="#245c45"/><text x="50" y="170" fill="#203b30" font-size="18" font-weight="700">보호자 앱</text><text x="50" y="194" fill="#65786e" font-size="13.5" font-weight="400">거주지역 저장</text><path d="M228.8 190H246.8" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="246.8" y="140" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="246.8" y="140" width="4" height="100" rx="2" fill="#245c45"/><text x="264.8" y="170" fill="#203b30" font-size="18" font-weight="700">Device API</text><text x="264.8" y="194" fill="#65786e" font-size="13.5" font-weight="400">Device Token</text><text x="264.8" y="213" fill="#65786e" font-size="13.5" font-weight="400">기상청 nx / ny</text><path d="M443.6 190H461.6" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="461.6" y="140" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="461.6" y="140" width="4" height="100" rx="2" fill="#245c45"/><text x="479.6" y="170" fill="#203b30" font-size="18" font-weight="700">환경 정보</text><text x="479.6" y="194" fill="#65786e" font-size="13.5" font-weight="400">기상청 날씨</text><text x="479.6" y="213" fill="#65786e" font-size="13.5" font-weight="400">HA sun.sun</text><path d="M658.4000000000001 190H676.4000000000001" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="676.4000000000001" y="140" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="676.4000000000001" y="140" width="4" height="100" rx="2" fill="#245c45"/><text x="694.4000000000001" y="170" fill="#203b30" font-size="18" font-weight="700">조명 규칙</text><text x="694.4000000000001" y="194" fill="#65786e" font-size="13.5" font-weight="400">밝기 계산</text><text x="694.4000000000001" y="213" fill="#65786e" font-size="13.5" font-weight="400">색온도 계산</text><path d="M873.2 190H891.2" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="891.2" y="140" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="891.2" y="140" width="4" height="100" rx="2" fill="#245c45"/><text x="909.2" y="170" fill="#203b30" font-size="18" font-weight="700">HA 조명</text><text x="909.2" y="194" fill="#65786e" font-size="13.5" font-weight="400">설정한 Entity</text><rect x="32" y="306" width="510" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="48" y="331" fill="#a54545" font-size="14" font-weight="700">Render 지역 조회 실패</text><text x="48" y="352" fill="#65786e" font-size="13" font-weight="400">해당 회차 변경을 중단하고 기존 조명 상태를 유지합니다.</text><rect x="560" y="306" width="528" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="576" y="331" fill="#315f92" font-size="14" font-weight="700">조회 시험</text><text x="576" y="352" fill="#65786e" font-size="13" font-weight="400">--check-location은 조명 제어 없이 지역만 확인합니다.</text></g></svg>
