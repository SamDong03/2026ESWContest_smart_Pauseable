<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790" role="img" aria-labelledby="title desc"><title id="title">세 메시지는 서로 다른 책임을 담습니다</title><desc id="desc">AI 판단을 그대로 앱으로 복사하지 않고, Central 정책과 API 표시 형식으로 각각 구성합니다.</desc><defs><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2c684d"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356797"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087b7d"/></marker><marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#916013"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9b4641"/></marker></defs><rect width="1440" height="790" fill="#fff"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="46" font-size="32" font-weight="700" fill="#23382f" data-max-width="1040">세 메시지는 서로 다른 책임을 담습니다</text><text x="1122" y="43" font-size="17" font-weight="700" fill="#52675d" data-max-width="286">Memolink / 개발팀 PAUSEABLE</text><text x="32" y="79" font-size="19" font-weight="400" fill="#52675d" data-max-width="1376">AI 판단을 그대로 앱으로 복사하지 않고, Central 정책과 API 표시 형식으로 각각 구성합니다.</text><path d="M32 100H1408" stroke="#dbe5df"/><rect x="32" y="126" width="424" height="370" rx="12" fill="#edf5ec" stroke="#abc8b2" stroke-width="1.3"/><g transform="translate(52 144) scale(1.0833333333333333)" fill="#660066"><path d="M10.657 23.994h-9.45A1.212 1.212 0 0 1 0 22.788v-9.18h.071c5.784 0 10.504 4.65 10.586 10.386Zm7.606 0h-4.045C14.135 16.246 7.795 9.977 0 9.942V6.038h.071c9.983 0 18.121 8.044 18.192 17.956Zm4.53 0h-.97C21.754 12.071 11.995 2.407 0 2.372v-1.16C0 .55.544.006 1.207.006h7.64C15.733 2.49 21.257 7.789 24 14.508v8.291c0 .663-.544 1.195-1.207 1.195ZM16.713.006h6.092A1.19 1.19 0 0 1 24 1.2v5.914c-.91-1.242-2.046-2.65-3.158-3.762C19.588 2.11 18.122.987 16.714.005Z"/></g><text x="90" y="166" font-size="23" font-weight="700" fill="#2c684d" data-max-width="346">AI → Central</text><path d="M32 184H456" stroke="#abc8b2"/><rect x="52" y="208" width="384" height="250" rx="8" fill="#fff" stroke="#abc8b2" stroke-width="1.3"/><text x="70" y="241" font-size="22" font-weight="700" fill="#23382f" data-max-width="348">Behavior Inference</text><text x="70" y="270" font-size="18" font-weight="400" fill="#52675d" data-max-width="348">source / behavior</text><text x="70" y="296" font-size="18" font-weight="400" fill="#52675d" data-max-width="348">risk_level / risk_score</text><text x="70" y="322" font-size="18" font-weight="400" fill="#52675d" data-max-width="348">inference_status / evidence</text><text x="70" y="348" font-size="18" font-weight="400" fill="#52675d" data-max-width="348">관측한 행동과 판단 근거</text><rect x="508" y="126" width="424" height="370" rx="12" fill="#edf3fb" stroke="#adc7e1" stroke-width="1.3"/><g transform="translate(528 144) scale(1.0833333333333333)" fill="#00599C"><path d="M22.394 6c-.167-.29-.398-.543-.652-.69L12.926.22c-.509-.294-1.34-.294-1.848 0L2.26 5.31c-.508.293-.923 1.013-.923 1.6v10.18c0 .294.104.62.271.91.167.29.398.543.652.69l8.816 5.09c.508.293 1.34.293 1.848 0l8.816-5.09c.254-.147.485-.4.652-.69.167-.29.27-.616.27-.91V6.91c.003-.294-.1-.62-.268-.91zM12 19.11c-3.92 0-7.109-3.19-7.109-7.11 0-3.92 3.19-7.11 7.11-7.11a7.133 7.133 0 016.156 3.553l-3.076 1.78a3.567 3.567 0 00-3.08-1.78A3.56 3.56 0 008.444 12 3.56 3.56 0 0012 15.555a3.57 3.57 0 003.08-1.778l3.078 1.78A7.135 7.135 0 0112 19.11zm7.11-6.715h-.79v.79h-.79v-.79h-.79v-.79h.79v-.79h.79v.79h.79zm2.962 0h-.79v.79h-.79v-.79h-.79v-.79h.79v-.79h.79v.79h.79z"/></g><text x="566" y="166" font-size="23" font-weight="700" fill="#356797" data-max-width="346">Central → API</text><path d="M508 1