<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="424" viewBox="0 0 1120 424" role="img" aria-labelledby="title desc"><title id="title">AI 추론 · 실행 결정 · 앱 알림의 통신 규격</title><desc id="desc">각 메시지는 판단 근거, 실행 정책과 보호자 표시라는 서로 다른 역할을 담당합니다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="424" rx="8" fill="#f5f8f6"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">AI 추론 · 실행 결정 · 앱 알림의 통신 규격</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">각 메시지는 판단 근거, 실행 정책과 보호자 표시라는 서로 다른 역할을 담당합니다.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="126" width="328" height="136" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="126" width="4" height="136" rx="2" fill="#245c45"/><text x="50" y="156" fill="#203b30" font-size="18" font-weight="700">AI 판단 메시지</text><text x="50" y="180" fill="#65786e" font-size="13.5" font-weight="400">source: repetitive-ai / wandering-ai</text><text x="50" y="199" fill="#65786e" font-size="13.5" font-weight="400">behavior / risk_level / risk_score</text><text x="50" y="218" fill="#65786e" font-size="13.5" font-weight="400">inference_status / evidence</text><rect x="396" y="126" width="328" height="136" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="396" y="126" width="4" height="136" rx="2" fill="#315f92"/><text x="414" y="156" fill="#203b30" font-size="18" font-weight="700">Central 최종 결정</text><text x="414" y="180" fill="#65786e" font-size="13.5" font-weight="400">source: central-atlas-app</text><text x="414" y="199" fill="#65786e" font-size="13.5" font-weight="400">decision / risk_level / actions</text><text x="414" y="218" fill="#65786e" font-size="13.5" font-weight="400">event_id / occurred_at</text><rect x="760" y="126" width="328" height="136" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="760" y="126" width="4" height="136" rx="2" fill="#147f82"/><text x="778" y="156" fill="#203b30" font-size="18" font-weight="700">보호자 알림</text><text x="778" y="180" fill="#65786e" font-size="13.5" font-weight="400">보호자에게 보여줄 사건 정보</text><text x="778" y="199" fill="#65786e" font-size="13.5" font-weight="400">알림 이력 · 읽음 상태</text><text x="778" y="218" fill="#65786e" font-size="13.5" font-weight="400">전송 접수와 실제 표시 구분</text><path d="M360 194H396" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M724 194H760" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="32" y="306" width="510" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="48" y="331" fill="#245c45" font-size="14" font-weight="700">식별자와 사건 시각</text><text x="48" y="352" fill="#65786e" font-size="13" font-weight="400">contract_version / event_id / patient_id / device_id / UTC</text><rect x="560" y="306" width="528" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="576" y="331" fill="#a46a1e" font-size="14" font-weight="700">관측 부족 · 추론 오류</text><text x="576" y="352" fill="#65786e" font-size="13" font-weight="400">행동과 위험도는 unknown, 점수는 null로 전달합니다.</text></g></svg>
