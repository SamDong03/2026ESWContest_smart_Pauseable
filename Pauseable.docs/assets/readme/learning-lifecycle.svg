<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc"><title id="title">이력 수집부터 모델 적용까지</title><desc id="desc">달력상 경과일이 아니라 유효 이력과 학습·검증 조건으로 모델 적용을 결정합니다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="520" rx="8" fill="#f5f8f6"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">이력 수집부터 모델 적용까지</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">달력상 경과일이 아니라 유효 이력과 학습·검증 조건으로 모델 적용을 결정합니다.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="140" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="140" width="4" height="100" rx="2" fill="#245c45"/><text x="50" y="170" fill="#203b30" font-size="18" font-weight="700">이력 수집</text><text x="50" y="194" fill="#65786e" font-size="13.5" font-weight="400">데이터 출처 · 가구</text><text x="50" y="213" fill="#65786e" font-size="13.5" font-weight="400">관측 범위 기록</text><path d="M228.8 190H246.8" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="246.8" y="140" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="246.8" y="140" width="4" height="100" rx="2" fill="#245c45"/><text x="264.8" y="170" fill="#203b30" font-size="18" font-weight="700">학습 조건</text><text x="264.8" y="194" fill="#65786e" font-size="13.5" font-weight="400">유효 관측 30일</text><text x="264.8" y="213" fill="#65786e" font-size="13.5" font-weight="400">정상 학습 후보</text><path d="M443.6 190H461.6" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="461.6" y="140" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="461.6" y="140" width="4" height="100" rx="2" fill="#245c45"/><text x="479.6" y="170" fill="#203b30" font-size="18" font-weight="700">IF · AE 학습</text><text x="479.6" y="194" fill="#65786e" font-size="13.5" font-weight="400">시간순 데이터 분할</text><text x="479.6" y="213" fill="#65786e" font-size="13.5" font-weight="400">학습 · 보정 · 평가</text><path d="M658.4000000000001 190H676.4000000000001" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="676.4000000000001" y="140" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="676.4000000000001" y="140" width="4" height="100" rx="2" fill="#245c45"/><text x="694.4000000000001" y="170" fill="#203b30" font-size="18" font-weight="700">모델 검증</text><text x="694.4000000000001" y="194" fill="#65786e" font-size="13.5" font-weight="400">학습·검증 기준</text><text x="694.4000000000001" y="213" fill="#65786e" font-size="13.5" font-weight="400">특징·모델 호환</text><path d="M873.2 190H891.2" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="891.2" y="140" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="891.2" y="140" width="4" height="100" rx="2" fill="#245c45"/><text x="909.2" y="170" fill="#203b30" font-size="18" font-weight="700">모델 적용</text><text x="909.2" y="194" fill="#65786e" font-size="13.5" font-weight="400">버전별 모델 저장</text><text x="909.2" y="213" fill="#65786e" font-size="13.5" font-weight="400">활성 버전 전환</text><path d="M775 240V282H536V316" fill="none" stroke="#a54545" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="344" y="316" width="384" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="360" y="341" fill="#a54545" font-size="14" font-weight="700">검증 실패 · 모델 사용 불가</text><text x="360" y="362" fill="#65786e" font-size="13" font-weight="400">기존 호환 모델을 유지하거나 Baseline으로 판단합니다.</text><rect x="32" y="410" width="510" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="48" y="435" fill="#315f92" font-size="14" font-weight="700">SHADOW</text><text x="48" y="456" fill="#65786e" font-size="