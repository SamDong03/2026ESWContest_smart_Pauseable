<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc"><title id="title">From observation to a versioned model</title><desc id="desc">The calendar alone does not trigger learning. Data eligibility and validation are required.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="520" rx="8" fill="#f5f8f6"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">From observation to a versioned model</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">The calendar alone does not trigger learning. Data eligibility and validation are required.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="140" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="140" width="4" height="100" rx="2" fill="#245c45"/><text x="50" y="170" fill="#203b30" font-size="18" font-weight="700">Collect</text><text x="50" y="194" fill="#65786e" font-size="13.5" font-weight="400">Source + household</text><text x="50" y="213" fill="#65786e" font-size="13.5" font-weight="400">Coverage metadata</text><path d="M228.8 190H246.8" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="246.8" y="140" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="246.8" y="140" width="4" height="100" rx="2" fill="#245c45"/><text x="264.8" y="170" fill="#203b30" font-size="18" font-weight="700">Eligibility</text><text x="264.8" y="194" fill="#65786e" font-size="13.5" font-weight="400">30 eligible days</text><text x="264.8" y="213" fill="#65786e" font-size="13.5" font-weight="400">Normal candidates</text><path d="M443.6 190H461.6" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="461.6" y="140" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="461.6" y="140" width="4" height="100" rx="2" fill="#245c45"/><text x="479.6" y="170" fill="#203b30" font-size="18" font-weight="700">Train IF / AE</text><text x="479.6" y="194" fill="#65786e" font-size="13.5" font-weight="400">Time-ordered splits</text><text x="479.6" y="213" fill="#65786e" font-size="13.5" font-weight="400">Calibration / test</text><path d="M658.4000000000001 190H676.4000000000001" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="676.4000000000001" y="140" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="676.4000000000001" y="140" width="4" height="100" rx="2" fill="#245c45"/><text x="694.4000000000001" y="170" fill="#203b30" font-size="18" font-weight="700">Validate</text><text x="694.4000000000001" y="194" fill="#65786e" font-size="13.5" font-weight="400">Quality gate</text><text x="694.4000000000001" y="213" fill="#65786e" font-size="13.5" font-weight="400">Compatibility</text><path d="M873.2 190H891.2" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="891.2" y="140" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="891.2" y="140" width="4" height="100" rx="2" fill="#245c45"/><text x="909.2" y="170" fill="#203b30" font-size="18" font-weight="700">Activate</text><text x="909.2" y="194" fill="#65786e" font-size="13.5" font-weight="400">Versioned bundle</text><text x="909.2" y="213" fill="#65786e" font-size="13.5" font-weight="400">Atomic pointer</text><path d="M775 240V282H536V316" fill="none" stroke="#a54545" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="344" y="316" width="384" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="360" y="341" fill="#a54545" font-size="14" font-weight="700">VALIDATION FAILURE / MODEL UNAVAILABLE</text><text x="360" y="362" fill="#65786e" font-size="13" font-weight="400">Retain a compatible current model or use Baseline.</text><rect x="32" y="410" width="510" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="48" y="435" fill="#315f92" font-size="14" font-weight="700">SHADOW</text><text x="48" y="456" fill="#65786e" font-size="13" font-weight="400">Record model scores without changing the rule decision.</text><rect x="560" y="410" width="528" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="576" y="435" fill="#245c45" font-size="14" font-weight="700">HYBRID</text><text x="576" y="456" fill="#65786e" font-size="13" font-weight="400">Use validated scores with observed repetition and policy gates.</text><text x="32" y="500" fill="#65786e" font-size="12" font-weight="400">Architecture / policy diagram. Not a live status display.</text></g></svg>
