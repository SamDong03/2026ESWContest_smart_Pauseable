<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="416" viewBox="0 0 1120 416" role="img" aria-labelledby="title desc"><title id="title">빌드 · 설치 · 실기 확인 절차</title><desc id="desc">소스 무결성을 확인한 뒤 장치에 설치하고 실제 입력과 출력으로 동작을 점검합니다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="416" rx="8" fill="#f5f8f6"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">빌드 · 설치 · 실기 확인 절차</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">소스 무결성을 확인한 뒤 장치에 설치하고 실제 입력과 출력으로 동작을 점검합니다.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="144" width="161" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="50" y="174" fill="#203b30" font-size="18" font-weight="700">백업</text><text x="50" y="198" fill="#65786e" font-size="13.5" font-weight="400">모델 · DB · 설정</text><path d="M193 194H211" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="211" y="144" width="161" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="211" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="229" y="174" fill="#203b30" font-size="18" font-weight="700">검증</text><text x="229" y="198" fill="#65786e" font-size="13.5" font-weight="400">소스 Manifest</text><path d="M372 194H390" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="390" y="144" width="161" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="390" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="408" y="174" fill="#203b30" font-size="18" font-weight="700">빌드</text><text x="408" y="198" fill="#65786e" font-size="13.5" font-weight="400">SDK / Docker / APK</text><path d="M551 194H569" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="569" y="144" width="161" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="569" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="587" y="174" fill="#203b30" font-size="18" font-weight="700">설정</text><text x="587" y="198" fill="#65786e" font-size="13.5" font-weight="400">ID · 인증 · 권한</text><path d="M730 194H748" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="748" y="144" width="161" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="748" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="766" y="174" fill="#203b30" font-size="18" font-weight="700">설치</text><text x="766" y="198" fill="#65786e" font-size="13.5" font-weight="400">파일 · 서비스</text><path d="M909 194H927" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="927" y="144" width="161" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="927" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="945" y="174" fill="#203b30" font-size="18" font-weight="700">실기 시험</text><text x="945" y="198" fill="#65786e" font-size="13.5" font-weight="400">입력부터 출력까지</text><rect x="32" y="304" width="510" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="48" y="329" fill="#315f92" font-size="14" font-weight="700">소스 압축 파일</text><text x="48" y="350" fill="#65786e" font-size="13" font-weight="400">Manifest의 소스·설정과 BUNDLE.sha256을 포함합니다.</text><rect x="560" y="304" width="528" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="576" y="329" fill="#a46a1e" font-size="14" font-weight="700">실행 산출물</text><text x="576" y="350" fill="#65786e" font-size="13" font-weight="400">Central 바이너리 · .ipk · APK · ONNX는 별도로 준비합니다.</text></g></svg>
