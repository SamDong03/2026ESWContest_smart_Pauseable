<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="416" viewBox="0 0 1120 416" role="img" aria-labelledby="title desc"><title id="title">Deployment is a sequence of explicit steps</title><desc id="desc">A Git push or an archive checksum is not a device execution test.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="416" rx="8" fill="#f5f8f6"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">Deployment is a sequence of explicit steps</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">A Git push or an archive checksum is not a device execution test.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="144" width="161" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="50" y="174" fill="#203b30" font-size="18" font-weight="700">Backup</text><text x="50" y="198" fill="#65786e" font-size="13.5" font-weight="400">Model / DB / config</text><path d="M193 194H211" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="211" y="144" width="161" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="211" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="229" y="174" fill="#203b30" font-size="18" font-weight="700">Verify</text><text x="229" y="198" fill="#65786e" font-size="13.5" font-weight="400">Source manifest</text><path d="M372 194H390" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="390" y="144" width="161" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="390" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="408" y="174" fill="#203b30" font-size="18" font-weight="700">Build</text><text x="408" y="198" fill="#65786e" font-size="13.5" font-weight="400">SDK / Docker / APK</text><path d="M551 194H569" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="569" y="144" width="161" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="569" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="587" y="174" fill="#203b30" font-size="18" font-weight="700">Configure</text><text x="587" y="198" fill="#65786e" font-size="13.5" font-weight="400">IDs / credentials</text><path d="M730 194H748" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="748" y="144" width="161" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="748" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="766" y="174" fill="#203b30" font-size="18" font-weight="700">Install</text><text x="766" y="198" fill="#65786e" font-size="13.5" font-weight="400">Files / services</text><path d="M909 194H927" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="927" y="144" width="161" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="927" y="144" width="4" height="100" rx="2" fill="#245c45"/><text x="945" y="174" fill="#203b30" font-size="18" font-weight="700">E2E</text><text x="945" y="198" fill="#65786e" font-size="13.5" font-weight="400">Input to output</text><rect x="32" y="304" width="510" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="48" y="329" fill="#315f92" font-size="14" font-weight="700">SOURCE ARCHIVE</text><text x="48" y="350" fill="#65786e" font-size="13" font-weight="400">Declared source and settings + BUNDLE.sha256.</text><rect x="560" y="304" width="528" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="576" y="329" fill="#a46a1e" font-size="14" font-weight="700">RUNTIME ARTIFACTS</text><text x="576" y="350" fill="#65786e" font-size="13" font-weight="400">Central binary / .ipk / APK / ONNX need separate preparation.</text><text x="32" y="396" fill="#65786e" font-size="12" font-weight="400">Architecture / policy diagram. Not a live status display.</text></g></svg>
