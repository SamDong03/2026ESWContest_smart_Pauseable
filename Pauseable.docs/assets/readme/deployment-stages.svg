<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="704" viewBox="0 0 1440 704" role="img" aria-labelledby="title desc"><title id="title">배포의 단계별 진행 조건</title><desc id="desc">소스 검증·설치·실기 시험을 구분하고, 실패한 단계에서 멈추거나 기존 상태로 복구합니다.</desc><defs><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2c684d"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356797"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087b7d"/></marker><marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#916013"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9b4641"/></marker></defs><rect width="1440" height="704" fill="#fff"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="46" font-size="32" font-weight="700" fill="#23382f" data-max-width="1040">배포의 단계별 진행 조건</text><text x="1122" y="43" font-size="17" font-weight="700" fill="#52675d" data-max-width="286">Memolink / 개발팀 PAUSEABLE</text><text x="32" y="79" font-size="19" font-weight="400" fill="#52675d" data-max-width="1376">소스 검증·설치·실기 시험을 구분하고, 실패한 단계에서 멈추거나 기존 상태로 복구합니다.</text><path d="M32 100H1408" stroke="#dbe5df"/><rect x="32" y="126" width="424" height="364" rx="12" fill="#edf5ec" stroke="#abc8b2" stroke-width="1.3"/><text x="52" y="166" font-size="23" font-weight="700" fill="#2c684d" data-max-width="384">01  준비와 검증</text><path d="M32 184H456" stroke="#abc8b2"/><rect x="52" y="210" width="384" height="98" rx="8" fill="#fff" stroke="#abc8b2" stroke-width="1.3"/><text x="70" y="243" font-size="22" font-weight="700" fill="#23382f" data-max-width="348">백업</text><text x="70" y="272" font-size="18" font-weight="400" fill="#52675d" data-max-width="348">모델 · DB · 환경 · 서비스</text><rect x="52" y="356" width="384" height="98" rx="8" fill="#fff" stroke="#abc8b2" stroke-width="1.3"/><text x="70" y="389" font-size="22" font-weight="700" fill="#23382f" data-max-width="348">소스 무결성</text><text x="70" y="418" font-size="18" font-weight="400" fill="#52675d" data-max-width="348">Manifest · 선언 파일 · 체크섬</text><path d="M244 308V356" fill="none" stroke="#2c684d" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="508" y="126" width="424" height="364" rx="12" fill="#edf3fb" stroke="#adc7e1" stroke-width="1.3"/><text x="528" y="166" font-size="23" font-weight="700" fill="#356797" data-max-width="384">02  대상 빌드와 설치</text><path d="M508 184H932" stroke="#adc7e1"/><rect x="528" y="210" width="384" height="98" rx="8" fill="#fff" stroke="#adc7e1" stroke-width="1.3"/><text x="546" y="243" font-size="22" font-weight="700" fill="#23382f" data-max-width="348">실행 산출물 준비</text><text x="546" y="272" font-size="18" font-weight="400" fill="#52675d" data-max-width="348">SDK / Docker / APK / ONNX</text><rect x="528" y="356" width="384" height="98" rx="8" fill="#fff" stroke="#adc7e1" stroke-width="1.3"/><text x="546" y="389" font-size="22" font-weight="700" fill="#23382f" data-max-width="348">장치 적용</text><text x="546" y="418" font-size="18" font-weight="400" fill="#52675d" data-max-width="348">ID · 인증 · 권한 · 서비스</text><path d="M720 308V356" fill="none" stroke="#356797" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-blue)"/><rect x="984" y="126" width="424" height="364" rx="12" fill="#eaf6f4" stroke="#a3ccc6" stroke-width="1.3"/><text x="1004" y="166" font-size="23" font-weight="700" fill="#087b7d" data-max-width="384">03  실제 입출력 확인</text><path d="M984 184H1408" stroke="#a3ccc6"/><rect x="1004" y="210" width="384" height="98" rx="8" fill="#fff" stroke="#a3ccc6" stroke-width="1.3"/><text x="1022" y="243" font-size="22" font-weight="700" fill="#23382f" data-max-width="348">서비스 + 입력</text><text x="1022" y="272" font-size="18" font-weight="400" fill="#52675d" data-max-width="348">수집 · 판단 · 승인 로그</text><rect x="1004" y="356" width="384" height="98" rx="8" fill="#fff" stroke="#a3ccc6" stroke-width="1.3"/><text x="1022" y="389" font-size="22" font-weight="700" fill="#23382f" data-max-width="348">출력과 전달</text><text x="1022" y="418" font-size="18" font-weight="400" fill="#52675d" data-max-width="348">TTS · 가전 · API · 앱 표시</text><path d="M1196 308V356" fill="none" stroke="#087b7d" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-teal)"/><path d="M436 405H480V259H528" fill="none" stroke="#2c684d" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><path d="M912 405H956V259H1004" fill="none" stroke="#356797" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-blue)"/><rect x="32" y="540" width="660" height="80" rx="8" fill="#fff0ee" stroke="#dfb3ad" stroke-width="1.3"/><text x="50" y="569" font-size="19" font-weight="700" fill="#9b4641" data-max-width="624">검증 실패 시 진행 중단</text><text x="50" y="597" font-size="18" font-weight="400" fill="#52675d" data-max-width="624">체크섬을 무조건 갱신하지 않고 원인과 포함 파일을 검토합니다.</text><rect x="716" y="540" width="692" height="80" rx="8" fill="#fff6e3" stroke="#ddc795" stroke-width="1.3"/><text x="734" y="569" font-size="19" font-weight="700" fill="#916013" data-max-width="656">설치 실패 시 필요한 파일만 복구</text><text x="734" y="597" font-size="18" font-weight="400" fill="#52675d" data-max-width="656">개인 이력·DB를 덮어쓰지 않고 백업 버전과 설정을 복원합니다.</text><text x="32" y="664" font-size="22" font-weight="700" fill="#23382f" data-max-width="1376">GitHub 반영 ≠ 장치 설치 ≠ 서비스 active ≠ 실제 출력 완료</text></g></svg>
