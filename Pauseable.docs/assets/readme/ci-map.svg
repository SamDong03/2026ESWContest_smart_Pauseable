nt-weight="400" fill="#52675d" data-max-width="624">문서 수정만으로 모든 런타임 검사가 다시 실행되지는 않습니다.</text><rect x="716" y="596" width="692" height="80" rx="8" fill="#fff6e3" stroke="#ddc795" stroke-width="1.3"/><text x="734" y="625" font-size="19" font-weight="700" fill="#916013" data-max-width="656">실기 E2E는 별도 시험</text><text x="734" y="653" font-size="18" font-weight="400" fill="#52675d" data-max-width="656">CI 통과는 GPU 학습·Pi 출력·휴대폰 표시 완료가 아닙니다.</text></g></svg>
