<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc"><title id="title">파트별 자동 검사와 앱 빌드</title><desc id="desc">변경 경로에 따라 Workflow를 실행하며 결과는 해당 commit의 Actions 기록에 남깁니다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="530" rx="8" fill="#f5f8f6"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">파트별 자동 검사와 앱 빌드</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">변경 경로에 따라 Workflow를 실행하며 결과는 해당 commit의 Actions 기록에 남깁니다.</text><path d="M32 88H1088" stroke="#d9e4dd"/><text x="48" y="126" fill="#65786e" font-size="12" font-weight="700">WORKFLOW</text><text x="410" y="126" fill="#65786e" font-size="12" font-weight="700">검사 항목</text><text x="830" y="126" fill="#65786e" font-size="12" font-weight="700">실행 조건 / 산출물</text><rect x="32" y="146" width="1056" height="54" rx="4" fill="#fff"/><text x="48" y="178" fill="#203b30" font-size="17" font-weight="700">HA 보고서</text><text x="410" y="178" fill="#65786e" font-size="14" font-weight="400">평가 데이터 / 회귀 검사 / python -O</text><text x="830" y="178" fill="#245c45" font-size="14" font-weight="400">PR / main / 수동</text><rect x="32" y="212" width="1056" height="54" rx="4" fill="#edf3f0"/><text x="48" y="244" fill="#203b30" font-size="17" font-weight="700">앱 + API</text><text x="410" y="244" fill="#65786e" font-size="14" font-weight="400">API 검사 / Flutter 분석·테스트·빌드</text><text x="830" y="244" fill="#245c45" font-size="14" font-weight="400">PR / main / 수동</text><rect x="32" y="278" width="1056" height="54" rx="4" fill="#fff"/><text x="48" y="310" fill="#203b30" font-size="17" font-weight="700">Voice</text><text x="410" y="310" fill="#65786e" font-size="14" font-weight="400">Worker / 학습 처리 / 모델 교체 / 설정</text><text x="830" y="310" fill="#245c45" font-size="14" font-weight="400">관련 push / PR</text><rect x="32" y="344" width="1056" height="54" rx="4" fill="#edf3f0"/><text x="48" y="376" fill="#203b30" font-size="17" font-weight="700">선호 음악</text><text x="410" y="376" fill="#65786e" font-size="14" font-weight="400">모의 Player / 라우팅 / Shell 문법</text><text x="830" y="376" fill="#245c45" font-size="14" font-weight="400">PR / main / 수동</text><rect x="32" y="410" width="1056" height="54" rx="4" fill="#fff"/><text x="48" y="442" fill="#203b30" font-size="17" font-weight="700">Android 시험 APK</text><text x="410" y="442" fill="#65786e" font-size="14" font-weight="400">비공개 설정 / Flutter / APK + SHA-256</text><text x="830" y="442" fill="#245c45" font-size="14" font-weight="400">수동 빌드 산출물</text></g></svg>
