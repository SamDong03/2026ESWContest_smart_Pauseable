<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="550" viewBox="0 0 1120 550" role="img" aria-labelledby="title desc"><title id="title">상황 판단에서 보호자 알림까지</title><desc id="desc">사건 접수, 저장, 전송과 휴대폰 표시를 단계별로 확인합니다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="550" rx="8" fill="#f5f8f6"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">상황 판단에서 보호자 알림까지</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">사건 접수, 저장, 전송과 휴대폰 표시를 단계별로 확인합니다.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="34" y="116" width="192" height="52" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="34" y="116" width="4" height="52" rx="2" fill="#245c45"/><text x="52" y="146" fill="#203b30" font-size="18" font-weight="700">Central</text><path d="M130 168V500" stroke="#c9d7cf" stroke-dasharray="4 5"/><rect x="314" y="116" width="192" height="52" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="314" y="116" width="4" height="52" rx="2" fill="#245c45"/><text x="332" y="146" fill="#203b30" font-size="18" font-weight="700">API</text><path d="M410 168V500" stroke="#c9d7cf" stroke-dasharray="4 5"/><rect x="594" y="116" width="192" height="52" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="594" y="116" width="4" height="52" rx="2" fill="#245c45"/><text x="612" y="146" fill="#203b30" font-size="18" font-weight="700">Push 서비스</text><path d="M690 168V500" stroke="#c9d7cf" stroke-dasharray="4 5"/><rect x="874" y="116" width="192" height="52" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="874" y="116" width="4" height="52" rx="2" fill="#245c45"/><text x="892" y="146" fill="#203b30" font-size="18" font-weight="700">보호자 앱</text><path d="M970 168V500" stroke="#c9d7cf" stroke-dasharray="4 5"/><path d="M130 211H410" fill="none" stroke="#315f92" stroke-width="1.8"  marker-end="url(#arrow)"/><text x="140" y="199" fill="#203b30" font-size="13" font-weight="400">1. Decision Event · Device Token</text><path d="M410 286H970" fill="none" stroke="#315f92" stroke-width="1.8"  marker-end="url(#arrow)"/><text x="420" y="274" fill="#203b30" font-size="13" font-weight="400">3. 열린 앱에 WebSocket 전달</text><path d="M410 352H690" fill="none" stroke="#315f92" stroke-width="1.8"  marker-end="url(#arrow)"/><text x="420" y="340" fill="#203b30" font-size="13" font-weight="400">4. FCM / Web Push 요청</text><path d="M690 411H970" fill="none" stroke="#315f92" stroke-width="1.8"  marker-end="url(#arrow)"/><text x="700" y="399" fill="#203b30" font-size="13" font-weight="400">5. OS / 브라우저 알림</text><path d="M970 478H410" fill="none" stroke="#315f92" stroke-width="1.8"  marker-end="url(#arrow)"/><text x="420" y="466" fill="#203b30" font-size="13" font-weight="400">6. 읽음 상태 갱신 · App Token</text><text x="424" y="249" fill="#245c45" font-size="13" font-weight="700">2. 검증 · 중복 처리 · 저장</text><text x="32" y="530" fill="#65786e" font-size="12" font-weight="400">Push 전달에는 기기 등록, 인증 설정과 OS·브라우저 권한이 필요합니다.</text></g></svg>
