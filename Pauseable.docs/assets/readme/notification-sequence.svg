<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc"><title id="title">사건 저장과 보호자 알림 전달</title><desc id="desc">저장 성공·전송 접수·실제 표시를 구분하고, 중지 설정은 반복행동 알림 경로에만 적용합니다.</desc><defs><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2c684d"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356797"/></marker><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087b7d"/></marker><marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#916013"/></marker><marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9b4641"/></marker></defs><rect width="1440" height="820" fill="#fff"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="46" font-size="32" font-weight="700" fill="#23382f" data-max-width="1040">사건 저장과 보호자 알림 전달</text><text x="1122" y="43" font-size="17" font-weight="700" fill="#52675d" data-max-width="286">Memolink / 개발팀 PAUSEABLE</text><text x="32" y="79" font-size="19" font-weight="400" fill="#52675d" data-max-width="1376">저장 성공·전송 접수·실제 표시를 구분하고, 중지 설정은 반복행동 알림 경로에만 적용합니다.</text><path d="M32 100H1408" stroke="#dbe5df"/><rect x="32" y="126" width="232" height="58" rx="8" fill="#fff" stroke="#adc7e1" stroke-width="1.3"/><text x="50" y="159" font-size="22" font-weight="700" fill="#23382f" data-max-width="196">Central</text><path d="M148 184V652" stroke="#dbe5df" stroke-dasharray="5 5"/><rect x="390" y="126" width="232" height="58" rx="8" fill="#fff" stroke="#adc7e1" stroke-width="1.3"/><text x="408" y="159" font-size="22" font-weight="700" fill="#23382f" data-max-width="196">API / 이력</text><path d="M506 184V652" stroke="#dbe5df" stroke-dasharray="5 5"/><rect x="762" y="126" width="232" height="58" rx="8" fill="#fff" stroke="#adc7e1" stroke-width="1.3"/><text x="780" y="159" font-size="22" font-weight="700" fill="#23382f" data-max-width="196">전달 정책</text><path d="M878 184V652" stroke="#dbe5df" stroke-dasharray="5 5"/><rect x="1134" y="126" width="232" height="58" rx="8" fill="#fff" stroke="#adc7e1" stroke-width="1.3"/><text x="1152" y="159" font-size="22" font-weight="700" fill="#23382f" data-max-width="196">Guardian / OS</text><path d="M1250 184V652" stroke="#dbe5df" stroke-dasharray="5 5"/><path d="M148 224H506" fill="none" stroke="#2c684d" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><text x="165" y="210" font-size="18" font-weight="700" fill="#2c684d" data-max-width="310">1. Decision + Device 인증</text><rect x="370" y="250" width="272" height="112" rx="8" fill="#fff" stroke="#adc7e1" stroke-width="1.3"/><text x="388" y="283" font-size="22" font-weight="700" fill="#23382f" data-max-width="236">2. 검증 · 중복 · 저장</text><text x="388" y="312" font-size="18" font-weight="400" fill="#52675d" data-max-width="236">같은 ID / 다른 내용 충돌</text><text x="388" y="338" font-size="18" font-weight="400" fill="#52675d" data-max-width="236">중지 중에도 이력은 보관</text><path d="M506 390H878" fill="none" stroke="#356797" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-blue)"/><text x="525" y="376" font-size="18" font-weight="700" fill="#356797" data-max-width="326">3. 반복행동 중지 여부 확인</text><rect x="742" y="412" width="272" height="112" rx="8" fill="#fff" stroke="#ddc795" stroke-width="1.3"/><text x="760" y="445" font-size="22" font-weight="700" fill="#23382f" data-max-width="236">중지 활성</text><text x="760" y="474" font-size="18" font-weight="400" fill="#52675d" data-max-width="236">반복 알림 전달만 생략</text><text x="760" y="500" font-size="18" font-weight="400" fill="#52675d" data-max-width="236">배회 · 사진은 유지</text><path d="M878 564H1250" fill="none" stroke="#087b7d" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-teal)"/><text x="900" y="548" font-size="17" font-weight="700" fill="#087b7d" data-max-width="340">4. 허용 시 WebSocket / Push</text><path d="M1250 628H506" fill="none" stroke="#356797" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-blue)"/><text x="690" y="612" font-size="18" font-weight="700" fill="#356797" data-max-width="550">5. 알림 선택 · 이력 조회 · 읽음 갱신</text><rect x="32" y="704" width="660" height="80" rx="8" fill="#fff6e3" stroke="#ddc795" stroke-width="1.3"/><text x="50" y="733" font-size="19" font-weight="700" fill="#916013" data-max-width="624">만료 시각을 영속 저장 · 자동 / 수동 재개</text><text x="50" y="761" font-size="18" font-weight="400" fill="#52675d" data-max-width="624">중지 기간의 과거 알림을 재개 시 다시 발송하지 않습니다.</text><rect x="716" y="704" width="692" height="80" rx="8" fill="#edf5ec" stroke="#abc8b2" stroke-width="1.3"/><text x="734" y="733" font-size="19" font-weight="700" fill="#2c684d" data-max-width="656">중지와 무관하게 유지하는 현장 처리</text><text x="734" y="761" font-size="18" font-weight="400" fill="#52675d" data-max-width="656">Pi 감지 · TTS · 가전, 사건 이력은 계속 동작합니다.</text></g></svg>
