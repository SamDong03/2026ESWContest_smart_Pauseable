<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="436" viewBox="0 0 1120 436" role="img" aria-labelledby="title desc"><title id="title">Pi 음성 모델 검증과 교체</title><desc id="desc">Model Updater가 게시된 모델을 검사한 뒤 Piper의 활성 모델을 변경합니다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="436" rx="8" fill="#f5f8f6"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">Pi 음성 모델 검증과 교체</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">Model Updater가 게시된 모델을 검사한 뒤 Piper의 활성 모델을 변경합니다.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="146" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="146" width="4" height="100" rx="2" fill="#245c45"/><text x="50" y="176" fill="#203b30" font-size="18" font-weight="700">다운로드</text><text x="50" y="200" fill="#65786e" font-size="13.5" font-weight="400">ONNX + JSON</text><path d="M228.8 196H246.8" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="246.8" y="146" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="246.8" y="146" width="4" height="100" rx="2" fill="#245c45"/><text x="264.8" y="176" fill="#203b30" font-size="18" font-weight="700">무결성 검사</text><text x="264.8" y="200" fill="#65786e" font-size="13.5" font-weight="400">크기 · SHA-256</text><path d="M443.6 196H461.6" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="461.6" y="146" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="461.6" y="146" width="4" height="100" rx="2" fill="#245c45"/><text x="479.6" y="176" fill="#203b30" font-size="18" font-weight="700">형식 검증</text><text x="479.6" y="200" fill="#65786e" font-size="13.5" font-weight="400">설정 · 산출물</text><path d="M658.4000000000001 196H676.4000000000001" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="676.4000000000001" y="146" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="676.4000000000001" y="146" width="4" height="100" rx="2" fill="#245c45"/><text x="694.4000000000001" y="176" fill="#203b30" font-size="18" font-weight="700">합성 시험</text><text x="694.4000000000001" y="200" fill="#65786e" font-size="13.5" font-weight="400">로컬 음성 생성</text><path d="M873.2 196H891.2" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="891.2" y="146" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="891.2" y="146" width="4" height="100" rx="2" fill="#245c45"/><text x="909.2" y="176" fill="#203b30" font-size="18" font-weight="700">모델 교체</text><text x="909.2" y="200" fill="#65786e" font-size="13.5" font-weight="400">활성 모델 변경</text><path d="M552 246V304" fill="none" stroke="#a54545" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/><rect x="312" y="318" width="500" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="328" y="343" fill="#a54545" font-size="14" font-weight="700">검증 실패 시 기존 모델 유지</text><text x="328" y="364" fill="#65786e" font-size="13" font-weight="400">다운로드·형식·합성 검사를 통과한 모델만 활성화합니다.</text></g></svg>
