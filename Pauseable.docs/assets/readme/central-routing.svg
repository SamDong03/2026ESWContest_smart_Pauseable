" font-size="18" font-weight="700">Deduplicate</text><text x="587" y="186" fill="#65786e" font-size="13.5" font-weight="400">event_id / conflict</text><path d="M819.5 182H837.5" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="837.5" y="132" width="250.5" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="837.5" y="132" width="4" height="100" rx="2" fill="#245c45"/><text x="855.5" y="162" fill="#203b30" font-size="18" font-weight="700">Action Router</text><text x="855.5" y="186" fill="#65786e" font-size="13.5" font-weight="400">Risk / enable flags</text><text x="855.5" y="205" fill="#65786e" font-size="13.5" font-weight="400">Cooldown</text><rect x="32" y="310" width="314" height="106" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="310" width="4" height="106" rx="2" fill="#a46a1e"/><text x="50" y="340" fill="#203b30" font-size="18" font-weight="700">Audit / suppressed</text><text x="50" y="364" fill="#65786e" font-size="13.5" font-weight="400">Unknown, rejected or blocked</text><text x="50" y="383" fill="#65786e" font-size="13.5" font-weight="400">Do not execute appliance actions</text><rect x="394" y="310" width="314" height="106" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="394" y="310" width="4" height="106" rx="2" fill="#245c45"/><text x="412" y="340" fill="#203b30" font-size="18" font-weight="700">Local guidance</text><text x="412" y="364" fill="#65786e" font-size="13.5" font-weight="400">Piper TTS / approved devices</text><text x="412" y="383" fill="#65786e" font-size="13.5" font-weight="400">Favorite music after guidance</text><rect x="756" y="310" width="332" height="106" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="756" y="310" width="4" height="106" rx="2" fill="#315f92"/><text x="774" y="340" fill="#203b30" font-size="18" font-weight="700">Outbox / API</text><text x="774" y="364" fill="#65786e" font-size="13.5" font-weight="400">Persistent pending delivery</text><text x="774" y="383" fill="#65786e" font-s