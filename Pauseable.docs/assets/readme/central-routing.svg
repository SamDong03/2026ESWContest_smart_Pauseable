 font-size="22" font-weight="700" fill="#23382f" data-max-width="280">Action Router</text><text x="1090" y="272" font-size="18" font-weight="400" fill="#52675d" data-max-width="280">활성화 · 위험 · cooldown</text><path d="M548 322V410H238V446" fill="none" stroke="#916013" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow-amber)"/><path d="M1230 322V398H720V446" fill="none" stroke="#2c684d" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><path d="M1284 322V418H1180V446" fill="none" stroke="#356797" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-blue)"/><rect x="32" y="446" width="412" height="160" rx="8" fill="#fff" stroke="#ddc795" stroke-width="1.3"/><text x="50" y="479" font-size="22" font-weight="700" fill="#23382f" data-max-width="376">거절 · 감사 · 억제</text><text x="50" y="508" font-size="18" font-weight="400" fill="#52675d" data-max-width="376">형식 / 시각 / 출처 불일치</text><text x="50" y="534" font-size="18" font-weight="400" fill="#52675d" data-max-width="376">중복 · Unknown · 실행 제한</text><text x="50" y="560" font-size="18" font-weight="400" fill="#52675d" data-max-width="376">실행 경로로 넘기지 않음</text><rect x="492" y="446" width="412" height="160" rx="8" fill="#fff" stroke="#abc8b2" stroke-width="1.3"/><text x="510" y="479" font-size="22" font-weight="700" fill="#23382f" data-max-width="376">허용한 로컬 출력</text><text x="510" y="508" font-size="18" font-weight="400" fill="#52675d" data-max-width="376">Piper TTS · 가전 연동</text><text x="510" y="534" font-size="18" font-weight="400" fill="#52675d" data-max-width="376">기존 안내 이후 선호 음악</text><text x="510" y="560" font-size="18" font-weight="400" fill="#52675d" data-max-width="376">실제 화면 · 소리는 별도 확인</text><rect x="952" y="446" width="456" height="160" rx="8" fill="#fff" stroke="#adc7e1" stroke-width="1.3"/><text x="970" y="479" font-size="22" font-weight="700" fill="#23382f" data-max-width="420">최종 사건 → API Outbox</text><text x="970" y="508" font-size="18" font-weight="400" fill="#52675d" data-max-width="420">영속 전송 대기 · 재시작 복구</text><text x="970" y="534" font-size="18" font-weight="400" fill="#52675d" data-max-width="420">Gateway 전송 · 실패 시 재시도</text><text x="970" y="560" font-size="18" font-weight="400" fill="#52675d" data-max-width="420">API 이력 → 보호자 알림</text><rect x="32" y="654" width="660" height="80" rx="8" fill="#edf5ec" stroke="#abc8b2" stroke-width="1.3"/><text x="50" y="683" font-size="19" font-weight="700" fill="#2c684d" data-max-width="624">Action Router 상태</text><text x="50" y="711" font-size="18" font-weight="400" fill="#52675d" data-max-width="624">행동별 위험 활성 · 최근 사건 · 실행 시각을 보관합니다.</text><rect x="716" y="654" width="692" height="80" rx="8" fill="#edf3fb" stroke="#adc7e1" stroke-width="1.3"/><text x="734" y="683" font-size="19" font-weight="700" fill="#356797" data-max-width="656">Outbox의 범위</text><text x="734" y="711" font-size="18" font-weight="400" fill="#52675d" data-max-width="656">API 전달용이며 TTS·가전의 물리 완료를 보장하지 않습니다.</text></g></svg>
