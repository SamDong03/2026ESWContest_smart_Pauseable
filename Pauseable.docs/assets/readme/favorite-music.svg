<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="418" viewBox="0 0 1120 418" role="img" aria-labelledby="title desc"><title id="title">Favorite music is an additional output path</title><desc id="desc">Selection comes from the current app list; request logs do not prove audible playback.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="418" rx="8" fill="#f5f8f6"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">Favorite music is an additional output path</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">Selection comes from the current app list; request logs do not prove audible playback.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="142" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="142" width="4" height="100" rx="2" fill="#245c45"/><text x="50" y="172" fill="#203b30" font-size="18" font-weight="700">Central approval</text><text x="50" y="196" fill="#65786e" font-size="13.5" font-weight="400">Action Router</text><path d="M228.8 192H246.8" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="246.8" y="142" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="246.8" y="142" width="4" height="100" rx="2" fill="#245c45"/><text x="264.8" y="172" fill="#203b30" font-size="18" font-weight="700">Guidance</text><text x="264.8" y="196" fill="#65786e" font-size="13.5" font-weight="400">TTS / devices</text><path d="M443.6 192H461.6" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="461.6" y="142" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="461.6" y="142" width="4" height="100" rx="2" fill="#245c45"/><text x="479.6" y="172" fill="#203b30" font-size="18" font-weight="700">Music request</text><text x="479.6" y="196" fill="#65786e" font-size="13.5" font-weight="400">Separate job</text><path d="M658.4000000000001 192H676.4000000000001" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="676.4000000000001" y="142" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="676.4000000000001" y="142" width="4" height="100" rx="2" fill="#245c45"/><text x="694.4000000000001" y="172" fill="#203b30" font-size="18" font-weight="700">API selection</text><text x="694.4000000000001" y="196" fill="#65786e" font-size="13.5" font-weight="400">Device Token</text><text x="694.4000000000001" y="215" fill="#65786e" font-size="13.5" font-weight="400">Current favorites</text><path d="M873.2 192H891.2" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="891.2" y="142" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="891.2" y="142" width="4" height="100" rx="2" fill="#245c45"/><text x="909.2" y="172" fill="#203b30" font-size="18" font-weight="700">Pi player</text><text x="909.2" y="196" fill="#65786e" font-size="13.5" font-weight="400">Validated video_id</text><rect x="32" y="306" width="510" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="48" y="331" fill="#a46a1e" font-size="14" font-weight="700">FAILURE ISOLATION</text><text x="48" y="352" fill="#65786e" font-size="13" font-weight="400">Empty list / auth / network / player error: skip music only.</text><rect x="560" y="306" width="528" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="576" y="331" fill="#315f92" font-size="14" font-weight="700">MUSIC COOLDOWN</text><text x="576" y="352" fill="#65786e" font-size="13" font-weight="400">Independent from behavior alert cooldown; default 300 seconds.</text><text x="32" y="398" fill="#65786e" font-size="12" font-weight="400">Architecture / policy diagram. Not a live status display.</text></g></svg>
