<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="418" viewBox="0 0 1120 418" role="img" aria-labelledby="title desc"><title id="title">행동 안내 후 선호 음악 재생</title><desc id="desc">앱에 등록된 현재 목록에서 곡을 선택해 Pi 화면·스피커로 재생을 요청합니다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="418" rx="8" fill="#f5f8f6"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">행동 안내 후 선호 음악 재생</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">앱에 등록된 현재 목록에서 곡을 선택해 Pi 화면·스피커로 재생을 요청합니다.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="142" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="142" width="4" height="100" rx="2" fill="#245c45"/><text x="50" y="172" fill="#203b30" font-size="18" font-weight="700">Central 승인</text><text x="50" y="196" fill="#65786e" font-size="13.5" font-weight="400">Action Router</text><path d="M228.8 192H246.8" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="246.8" y="142" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="246.8" y="142" width="4" height="100" rx="2" fill="#245c45"/><text x="264.8" y="172" fill="#203b30" font-size="18" font-weight="700">기존 안내</text><text x="264.8" y="196" fill="#65786e" font-size="13.5" font-weight="400">TTS · 가전</text><path d="M443.6 192H461.6" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="461.6" y="142" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="461.6" y="142" width="4" height="100" rx="2" fill="#245c45"/><text x="479.6" y="172" fill="#203b30" font-size="18" font-weight="700">음악 요청</text><text x="479.6" y="196" fill="#65786e" font-size="13.5" font-weight="400">별도 비동기 작업</text><path d="M658.4000000000001 192H676.4000000000001" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="676.4000000000001" y="142" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="676.4000000000001" y="142" width="4" height="100" rx="2" fill="#245c45"/><text x="694.4000000000001" y="172" fill="#203b30" font-size="18" font-weight="700">API 곡 선택</text><text x="694.4000000000001" y="196" fill="#65786e" font-size="13.5" font-weight="400">Device Token</text><text x="694.4000000000001" y="215" fill="#65786e" font-size="13.5" font-weight="400">현재 선호 목록</text><path d="M873.2 192H891.2" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="891.2" y="142" width="196.8" height="100" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="891.2" y="142" width="4" height="100" rx="2" fill="#245c45"/><text x="909.2" y="172" fill="#203b30" font-size="18" font-weight="700">Pi Player</text><text x="909.2" y="196" fill="#65786e" font-size="13.5" font-weight="400">검증한 video_id</text><rect x="32" y="306" width="510" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="48" y="331" fill="#a46a1e" font-size="14" font-weight="700">음악 경로의 오류 처리</text><text x="48" y="352" fill="#65786e" font-size="13" font-weight="400">빈 목록·인증·네트워크·재생 오류는 음악만 건너뜁니다.</text><rect x="560" y="306" width="528" height="62" rx="5" fill="#fff" stroke="#d6e2db"/><text x="576" y="331" fill="#315f92" font-size="14" font-weight="700">재요청 제한 시간</text><text x="576" y="352" fill="#65786e" font-size="13" font-weight="400">기본 300초이며 행동 알림의 cooldown과 별도입니다.</text></g></svg>
