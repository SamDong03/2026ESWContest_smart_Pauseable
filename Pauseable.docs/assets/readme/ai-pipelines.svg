<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="548" viewBox="0 0 1120 548" role="img" aria-labelledby="title desc"><title id="title">Three pipelines, separate responsibilities</title><desc id="desc">Behavior models publish decisions. Voice training produces a deployable model.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="548" rx="8" fill="#f5f8f6"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">Three pipelines, separate responsibilities</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">Behavior models publish decisions. Voice training produces a deployable model.</text><path d="M32 88H1088" stroke="#d9e4dd"/><text x="32" y="169" fill="#245c45" font-size="17" font-weight="700">HA</text><rect x="150" y="124" width="224" height="86" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="150" y="124" width="4" height="86" rx="2" fill="#245c45"/><text x="168" y="154" fill="#203b30" font-size="18" font-weight="700">HA events</text><text x="168" y="178" fill="#65786e" font-size="13.5" font-weight="400">state_changed / Recorder</text><path d="M374 167H388" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="388" y="124" width="224" height="86" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="388" y="124" width="4" height="86" rx="2" fill="#245c45"/><text x="406" y="154" fill="#203b30" font-size="18" font-weight="700">Features</text><text x="406" y="178" fill="#65786e" font-size="13.5" font-weight="400">10m / 30m / 1h / 2h</text><path d="M612 167H626" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="626" y="124" width="224" height="86" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="626" y="124" width="4" height="86" rx="2" fill="#245c45"/><text x="644" y="154" fill="#203b30" font-siz