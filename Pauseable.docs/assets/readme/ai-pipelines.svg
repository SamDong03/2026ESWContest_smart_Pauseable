/><rect x="992" y="220" width="392" height="96" rx="8" fill="#fff" stroke="#c8b3d8" stroke-width="1.3"/><text x="1010" y="254" font-size="23" fill="#21372d" font-weight="700" text-anchor="start">보호자 녹음 · 동의</text><text x="1010" y="286" font-size="17" fill="#56685e" font-weight="400" text-anchor="start">WAV 형식 · 대본 · 녹음 정보 검사</text><path d="M1188 316V348" fill="none" stroke="#79578f" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-violet)"/><rect x="992" y="348" width="392" height="96" rx="8" fill="#fff" stroke="#c8b3d8" stroke-width="1.3"/><text x="1010" y="382" font-size="23" fill="#21372d" font-weight="700" text-anchor="start">GPU 음성 학습</text><text x="1010" y="414" font-size="17" fill="#56685e" font-weight="400" text-anchor="start">Piper fine-tuning</text><path d="M1188 444V476" fill="none" stroke="#79578f" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-violet)"/><rect x="992" y="476" width="392" height="96" rx="8" fill="#fff" stroke="#c8b3d8" stroke-width="1.3"/><text x="1010" y="510" font-size="23" fill="#21372d" font-weight="700" text-anchor="start">모델 변환 · 검증</text><text x="1010" y="542" font-size="17" fill="#56685e" font-weight="400" text-anchor="start">ONNX · JSON · 샘플 음성</text><path d="M1188 572V604" fill="none" stroke="#79578f" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-violet)"/><rect x="992" y="604" width="392" height="96" rx="8" fill="#fff" stroke="#c8b3d8" stroke-width="1.3"/><text x="1010" y="638" font-size="23" fill="#21372d" font-weight="700" text-anchor="start">Pi 5 모델 배포</text><text x="1010" y="670" font-size="17" fill="#56685e" font-weight="400" text-anchor="start">다운로드 · 검증 후 활성 모델 교체</text><path d="M252 700V764H486" fill="none" stroke="#38734b" stroke-width="2.2"/><path d="M720 700V764H486" fill="none" stroke="#376a9d" stroke-width="2.2"/><path d="M486 764V796" fill="none" stroke="#38734b" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><text x="486" y="7