<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="916" viewBox="0 0 1440 916" role="img" aria-labelledby="title desc"><title id="title">Memolink AI 분석과 음성 학습 구조 · 개발팀 PAUSEABLE</title><desc id="desc">가전 반복행동과 배회 판단은 각 MQTT 메시지로 Central에 전달됩니다. 개인화 음성은 GPU에서 학습한 모델을 Pi 5에서 검증 후 사용합니다.</desc><defs><marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#38734b"/></marker><marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#376a9d"/></marker><marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#93611e"/></marker><marker id="arrow-violet" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#79578f"/></marker></defs><rect width="1440" height="916" fill="#fff"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="47" font-size="32" fill="#21372d" font-weight="700" text-anchor="start">Memolink AI 분석 · 음성 학습 구조</text><text x="1408" y="47" font-size="19" fill="#56685e" font-weight="700" text-anchor="end">개발팀 PAUSEABLE</text><text x="32" y="79" font-size="19" fill="#56685e" font-weight="400" text-anchor="start">반복행동·배회 판단과 개인화 음성 학습을 서로 독립된 파이프라인으로 구성합니다.</text><rect x="32" y="112" width="440" height="620" rx="16" fill="#eaf4e7" stroke="#a9cda2" stroke-width="1.3"/><text x="56" y="152" font-size="25" fill="#38734b" font-weight="700" text-anchor="start">가전 반복행동</text><text x="56" y="180" font-size="17" fill="#56685e" font-weight="400" text-anchor="start">Home Assistant · Pi 5 / Python</text><path d="M56 198H448" stroke="#a9cda2"/><rect x="56" y="220" width="392" height="96" rx="8" fill="#fff" stroke="#a9cda2" stroke-width="1.3"/><text x="74" y="254" font-size="23" fill="#21372d" font-weight="700" text-anchor="start">가전 상태 수집</text><text x="74" y="286" font-size="17" fill="#56685e" font-weight="400" text-anchor="start">state_changed · WebSocket</text><path d="M252 316V348" fill="none" stroke="#38734b" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="56" y="348" width="392" height="96" rx="8" fill="#fff" stroke="#a9cda2" stroke-width="1.3"/><text x="74" y="382" font-size="23" fill="#21372d" font-weight="700" text-anchor="start">시간 구간별 특징 생성</text><text x="74" y="414" font-size="17" fill="#56685e" font-weight="400" text-anchor="start">최근 10분 · 30분 · 1시간 · 2시간</text><path d="M252 444V476" fill="none" stroke="#38734b" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="56" y="476" width="392" height="96" rx="8" fill="#fff" stroke="#a9cda2" stroke-width="1.3"/><text x="74" y="510" font-size="23" fill="#21372d" font-weight="700" text-anchor="start">반복행동 판단</text><text x="74" y="537" font-size="17" fill="#56685e" font-weight="400" text-anchor="start">Baseline + IF + AE</text><text x="74" y="560" font-size="17" fill="#56685e" font-weight="400" text-anchor="start">반복 증거 · 관측 품질 · 개인 생활패턴</text><path d="M252 572V604" fill="none" stroke="#38734b" stroke-width="2.2" stroke-linejoin="round"  marker-end="url(#arrow-green)"/><rect x="56" y="604" width="392" height="96" rx="8" fill="#fff" stroke="#a9cda2" stroke-width="1.3"/><text x="74" y="638" font-size="23" fill="#21372d" font-weight="700" text-anchor="start">판단 결과 전송</text><text x="74" y="670" font-size="17" fill="#56685e" font-weight="400" text-anchor="start">MQTT · repetitive-ai · 공통 JSON</text><rect x="500" y="112" width="440" height="620" rx="16" fill="#eaf1fc" stroke="#adc4e4" stroke-width="1.3"/><text x="524" y="152" font-size="25" fill="#376a9d" font-weight="700" text-anchor="start">배회 의심 판단</text><text x="524" y="180" font-size="17" fill="#56685e" font-weight="400" text-anchor="start">mmWave · Pi 5 / Python</text><path d="M524 198H916" stroke="#adc4e4"/><rect x="524" y="220" width="392" height="96" rx="8" fill="#fff" stroke=