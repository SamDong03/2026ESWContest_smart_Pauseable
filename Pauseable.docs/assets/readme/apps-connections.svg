<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc"><title id="title">장치 · API · 보호자 앱 연결</title><desc id="desc">API는 사건과 설정을 저장하고, 앱 알림과 음성 학습 작업을 연결합니다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="530" rx="8" fill="#f5f8f6"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">장치 · API · 보호자 앱 연결</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">API는 사건과 설정을 저장하고, 앱 알림과 음성 학습 작업을 연결합니다.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="136" width="256" height="94" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="136" width="4" height="94" rx="2" fill="#245c45"/><text x="50" y="166" fill="#203b30" font-size="18" font-weight="700">Pi 5 / Central</text><text x="50" y="190" fill="#65786e" font-size="13.5" font-weight="400">최종 Decision Event</text><text x="50" y="209" fill="#65786e" font-size="13.5" font-weight="400">Device Token</text><rect x="32" y="284" width="256" height="94" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="284" width="4" height="94" rx="2" fill="#315f92"/><text x="50" y="314" fill="#203b30" font-size="18" font-weight="700">Pi 4 / Camera</text><text x="50" y="338" fill="#65786e" font-size="13.5" font-weight="400">출입 이벤트 사진</text><text x="50" y="357" fill="#65786e" font-size="13.5" font-weight="400">Device Token</text><rect x="430" y="208" width="264" height="112" rx="6" fill="#245c45" stroke="#245c45"/><rect x="430" y="208" width="4" height="112" rx="2" fill="#245c45"/><text x="448" y="238" fill="#fff" font-size="18" font-weight="700">FastAPI / Render</text><text x="448" y="262" fill="#e4eee8" font-size="13.5" font-weight="400">인증 · 사건 이력 저장</text><text x="448" y="281" fill="#e4eee8" font-size="13.5" font-weight="400">개인 설정 · 음성 학습 작업</text><rect x="820" y="136" width="268" height="94" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="820" y="136" width="4" height="94" rx="2" fill="#147f82"/><text x="838" y="166" fill="#203b30" font-size="18" font-weight="700">Flutter 보호자 앱</text><text x="838" y="190" fill="#65786e" font-size="13.5" font-weight="400">REST / WebSocket / Push</text><text x="838" y="209" fill="#65786e" font-size="13.5" font-weight="400">상황 확인 · 설정 · 녹음</text><rect x="820" y="356" width="268" height="94" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="820" y="356" width="4" height="94" rx="2" fill="#315f92"/><text x="838" y="386" fill="#203b30" font-size="18" font-weight="700">GPU Worker</text><text x="838" y="410" fill="#65786e" font-size="13.5" font-weight="400">학습 작업 임대 · 처리</text><text x="838" y="429" fill="#65786e" font-size="13.5" font-weight="400">Worker Token</text><rect x="430" y="392" width="264" height="86" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="430" y="392" width="4" height="86" rx="2" fill="#147f82"/><text x="448" y="422" fill="#203b30" font-size="18" font-weight="700">R2 / 비공개 저장소</text><text x="448" y="446" fill="#65786e" font-size="13.5" font-weight="400">사진 · WAV · 음성 모델</text><path d="M288 183H358V242H430" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M288 331H358V286H430" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M694 242H752V183H820" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M820 211H778V282H694" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M562 320V392" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M694 300H748V386H820" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M694 418H820" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><path d="M820 440H694" fill="no