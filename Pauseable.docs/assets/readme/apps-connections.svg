<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="530" viewBox="0 0 1120 530" role="img" aria-labelledby="title desc"><title id="title">The app and API connect people, devices and jobs</title><desc id="desc">Inference stays on the AI side; approved device actions stay on the edge side.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="530" rx="8" fill="#f5f8f6"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">The app and API connect people, devices and jobs</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">Inference stays on the AI side; approved device actions stay on the edge side.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="136" width="256" height="94" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="136" width="4" height="94" rx="2" fill="#245c45"/><text x="50" y="166" fill="#203b30" font-size="18" font-weight="700">Pi 5 / Central</text><text x="50" y="190" fill="#65786e" font-size="13.5" font-weight="400">Decision Event</text><text x="50" y="209" fill="#65786e" font-size="13.5" font-weight="400">Device Token</text><rect x="32" y="284" width="256" height="94" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="32" y="284" width="4" height="94" rx="2" fill="#315f92"/><text x="50" y="314" fill="#203b30" font-size="18" font-weight="700">Pi 4 / Camera</text><text x="50" y="338" fill="#65786e" font-size="13.5" font-weight="400">Door-event photo</text><text x="50" y="357" fill="#65786e" font-size="13.5" font-weight="400">Device Token</text><rect x="430" y="208" width="264" height="112" rx="6" fill="#245c45" stroke="#245c45"/><rect x="430" y="208" width="4" height="112" rx="2" fill="#245c45"/><text x="448" y="238" fill="#fff" font-size="18" font-weight="700">FastAPI / Render</text><text x="448" y="262" fill="#e4eee8" font-s