<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="556" viewBox="0 0 1120 556" role="img" aria-labelledby="title desc"><title id="title">장치별 배포 소스 구성</title><desc id="desc">Manifest에 선언한 소스를 장치별로 묶고, 빌드·설치에 필요한 환경을 준비합니다.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b4c8bd"/></marker></defs><rect width="1120" height="556" rx="8" fill="#f5f8f6"/><g font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', Arial, sans-serif"><text x="32" y="38" fill="#203b30" font-size="25" font-weight="700">장치별 배포 소스 구성</text><text x="32" y="65" fill="#65786e" font-size="14" font-weight="400">Manifest에 선언한 소스를 장치별로 묶고, 빌드·설치에 필요한 환경을 준비합니다.</text><path d="M32 88H1088" stroke="#d9e4dd"/><rect x="32" y="232" width="228" height="108" rx="6" fill="#245c45" stroke="#245c45"/><rect x="32" y="232" width="4" height="108" rx="2" fill="#245c45"/><text x="50" y="262" fill="#fff" font-size="18" font-weight="700">저장소 소스</text><text x="50" y="286" fill="#e4eee8" font-size="13.5" font-weight="400">배포 Manifest 검사</text><text x="50" y="305" fill="#e4eee8" font-size="13.5" font-weight="400">장치 인증값 제외</text><rect x="390" y="126" width="310" height="86" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="390" y="126" width="4" height="86" rx="2" fill="#315f92"/><text x="408" y="156" fill="#203b30" font-size="18" font-weight="700">Pi 3 소스 묶음</text><text x="408" y="180" fill="#65786e" font-size="13.5" font-weight="400">센서 중계 · 통신 규격</text><path d="M260 286H322V169H390" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="804" y="126" width="284" height="86" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="804" y="126" width="4" height="86" rx="2" fill="#315f92"/><text x="822" y="156" fill="#203b30" font-size="18" font-weight="700">장치 환경 준비</text><text x="822" y="180" fill="#65786e" font-size="13.5" font-weight="400">Serial · 사용자 · SSH · FIFO</text><path d="M700 169H804" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="390" y="266" width="310" height="86" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="390" y="266" width="4" height="86" rx="2" fill="#147f82"/><text x="408" y="296" fill="#203b30" font-size="18" font-weight="700">Pi 4 소스 묶음</text><text x="408" y="320" fill="#65786e" font-size="13.5" font-weight="400">카메라 · 업로드 설정</text><path d="M260 286H322V309H390" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="804" y="266" width="284" height="86" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="804" y="266" width="4" height="86" rx="2" fill="#147f82"/><text x="822" y="296" fill="#203b30" font-size="18" font-weight="700">장치 환경 준비</text><text x="822" y="320" fill="#65786e" font-size="13.5" font-weight="400">카메라 · Docker · 권한</text><path d="M700 309H804" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="390" y="406" width="310" height="86" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="390" y="406" width="4" height="86" rx="2" fill="#245c45"/><text x="408" y="436" fill="#203b30" font-size="18" font-weight="700">Pi 5 소스 묶음</text><text x="408" y="460" fill="#65786e" font-size="13.5" font-weight="400">Central · AI · 출력 설정</text><path d="M260 286H322V449H390" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/><rect x="804" y="406" width="284" height="86" rx="6" fill="#fff" stroke="#d6e2db"/><rect x="804" y="406" width="4" height="86" rx="2" fill="#245c45"/><text x="822" y="436" fill="#203b30" font-size="18" font-weight="700">장치 환경 준비</text><text x="822" y="460" fill="#65786e" font-size="13.5" font-weight="400">SDK · Docker · 모델 · 서비스</text><path d="M700 449H804" fill="none" stroke="#b4c8bd" stroke-width="1.8"  marker-end="url(#arrow)"/></g></svg>
