name: HA report comparison checks

on:
  pull_request:
    paths:
      - 'Pauseable.docs/evaluation/ha/**'
      - 'Pauseable.docs/presentation/ha/**'
      - 'Pauseable.ai/ha/src/**'
      - 'Pauseable.ai/ha/requirements.txt'
      - '.github/workflows/ha-report-checks.yml'
  push:
    branches: [main]
    paths:
      - 'Pauseable.docs/evaluation/ha/**'
      - 'Pauseable.docs/presentation/ha/**'
      - 'Pauseable.ai/ha/src/**'
      - 'Pauseable.ai/ha/requirements.txt'
      - '.github/workflows/ha-report-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Pauseable.ai/ha/requirements.txt
      - run: python -m pip install -r Pauseable.ai/ha/requirements.txt
      - name: Report unit tests
        run: python -m unittest discover -s Pauseable.docs/evaluation/ha/checks -v
      - name: Optimized Python must retain report validation
        run: python -O -m unittest discover -s Pauseable.docs/evaluation/ha/checks -v
